server:
  port: 8080

spring:
  application:
    name: demo-api
  
  # Docker环境使用PostgreSQL
  datasource:
    url: jdbc:postgresql://database:5432/demo
    username: demo
    password: demo123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Docker环境禁用Flyway，使用JPA自动建表
  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.example.demo: DEBUG
