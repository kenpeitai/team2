version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # 使用宿主机IP，让前端能正确调用后端API
      - NEXT_PUBLIC_API_BASE_URL=http://host.docker.internal:8080
      - CHOKIDIDAR_USEPOLLING=true  # Windows文件系统兼容性
    # 移除依赖关系，让前端可以独立启动
    # depends_on:
    #   - backend
    # 添加extra_hosts确保host.docker.internal可用
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 后端服务
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
      - sqlite_data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m  # 内存限制，适合不同配置
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 数据库服务 - 使用更兼容的配置
  database:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    # 移除可能有问题的command配置
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlite_data:
  postgres_data:
    


